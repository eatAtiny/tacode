# agentic 配置文件示例
#
# 用法：agentic -config config.yaml
# 优先级：config 文件 > 环境变量（OPENAI_CONTEXT_LIMIT 等）> 代码默认。
# 未声明的字段保持默认值；全部省略则与不传 -config 行为一致。

# LLM 采样温度（默认 0.2，范围 [0, 2]）
temperature: 0.2

# ReAct 最大循环次数，防止无限循环（默认 10，必须 >= 1）
max_iterations: 10

# 工具结果截断上限，字符数（默认 8000）
result_limit: 8000

# 上下文压缩阈值（预留，当前无生效路径）：默认 0.8，范围 (0, 1)。
# 该配置注入 Retriever 的 L2 压缩阈值，但判定路径（CheckAndCompress）无生产调用；
# 实际压缩由 Compactor 字符口径管线（context_char_limit）驱动。
compress_threshold: 0.8

# 上下文字符上限：超过该字符数触发压缩管线（默认 50000，必须 > 0）。
# 镜像 s08 的 CONTEXT_CHAR_LIMIT：压缩管线（大结果转存→消息归档→微压缩→历史摘要）以此为触发基准。
# context_char_limit: 50000

# 模型上下文窗口大小（token 数，预留，当前无生效路径）。
# 覆盖 OPENAI_CONTEXT_LIMIT 与模型名推断；但当前无消费方（压缩判断已改用
# Compactor 字符口径），设置后不产生实际影响。
# context_limit: 128000
